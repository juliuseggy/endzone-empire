<!doctype html>
<html lang="de">
<head>

  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <nav class="top">

  <header class="hero">
    <div class="wrap">
      <h1>Hall of Champions</h1>
      <p>Alle Gewinner des Endzone Empires und ihre Preise</p>
    </div>
  </header>

  <main class="wrap">
    <section id="saison-2025">
      <h2>Saison 2025/26</h2>
      <div class="champ-row">
      <article class="champ">
        <div class="champ-head">
          <span class="league">Redraft Empire</span>
          <h3>Marc</h3>
          <p class="team">Rietberger Seahawks</p>
        </div>
        <div class="gallery">
          <div class="photo-soon">Foto folgt</div>
        </div>
      </article>

      <article class="champ">
        <div class="champ-head">
          <span class="league">Dynasty Empire</span>
          <h3>Benni</h3>
          <p class="team">Berlin Ravens</p>
        </div>
        <div class="gallery">
          <a href="champions/2025-dynasty-benni-ring.jpg"><img src="champions/2025-dynasty-benni-ring.jpg" alt="Championship-Ring von Benni (Berlin Ravens), Dynasty Empire 2025" loading="lazy"></a>
          <a href="champions/2025-dynasty-benni-ring-2.jpg"><img src="champions/2025-dynasty-benni-ring-2.jpg" alt="Championship-Ring von Benni, Seitenansicht" loading="lazy"></a>
        </div>
      </article>
      </div>
    </section>

    <section id="saison-2024">
      <h2>Saison 2024/25</h2>
      <div class="champ-row">
      <article class="champ">
        <div class="champ-head">
          <span class="league">Champion</span>
          <h3>Eric</h3>
          <p class="team">CB-Eagles</p>
        </div>
        <div class="gallery">
          <a href="champions/2024-eric-ring.jpg"><img src="champions/2024-eric-ring.jpg" alt="Championship-Ring von Eric (CB-Eagles), Champion 2024" loading="lazy"></a>
        </div>
      </article>
      </div>
    </section>

  <footer>© Endzone Empire</footer>
