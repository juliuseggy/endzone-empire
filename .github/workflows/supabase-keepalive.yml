# Hält das Supabase-Projekt (Free-Tarif) wach. Reine Lesezugriffe haben das
# Pausieren nicht verhindert, deshalb schreibt die Action täglich einen
# Zeitstempel über keepalive() (siehe supabase/keepalive.sql) und prüft danach,
# ob die Regelvorschläge lesbar sind. URL und Key kommen aus config.js.
name: Supabase wach halten

on:
  schedule:
    - cron: '0 6 * * *'  # täglich, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zeitstempel schreiben und Vorschläge lesen
        run: |
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" config.js)
          curl --fail --silent --show-error --max-time 30 -X POST \
            "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          curl --fail --silent --show-error --max-time 30 \
            "$URL/rest/v1/regelvorschlaege?select=id&limit=1" \
            -H "apikey: $KEY"
